name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Check formatting (gofmt)
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Files not formatted with gofmt -s:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build binary
        run: go build -trimpath -o a2a-mailbox .

      - name: Run unit & black-box tests with race detector
        run: go test -v -count=1 -race ./...
